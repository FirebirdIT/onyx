name: Deep X native engine

# Builds the engine bundle that the desktop app runs without Docker
# (desktop/native-engine/build-bundle.sh) on a Mac of each architecture, and
# publishes the release "Deep X native engine <semver>" with the bundles and
# native.json. The hub serves native.json at /api/engine/native.

on:
  push:
    tags:
      - "native-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver of the bundle, for example 1.2.3 (no native-v prefix)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deepx-native-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve the version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${REF_NAME#native-v}}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '${version}' is not a semver like 1.2.3"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=native-v${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: resolve-version
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            platform: darwin-aarch64
          - runner: macos-15-intel
            platform: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          # No cache: a release build must not reuse files from another run.
          enable-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2 # zizmor: ignore[cache-poisoning]
        with:
          bun-version: "1.3.13"

      - name: Build the bundle
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: desktop/native-engine/build-bundle.sh "${VERSION}" "${RUNNER_TEMP}/dist"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/*
          retention-days: 3

  publish:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true

      - name: Write native.json and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          entries="{}"
          for file in deepx-engine-"${VERSION}"-*.tar.gz; do
            platform="${file#deepx-engine-${VERSION}-}"
            platform="${platform%.tar.gz}"
            sha=$(awk '{print $1}' "${file}.sha256")
            size=$(stat -c %s "${file}")
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${file}"
            entries=$(jq --arg p "${platform}" --arg url "${url}" --arg sha "${sha}" --argjson size "${size}" \
              '. + {($p): {url: $url, sha256: $sha, size: $size}}' <<< "${entries}")
          done
          jq -n --arg version "${VERSION}" --argjson platforms "${entries}" \
            '{version: $version, platforms: $platforms}' > native.json
          cat native.json
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
              --title "Deep X native engine ${VERSION}" --latest=false \
              --notes "Engine bundles for the Deep X desktop app without Docker."
          fi
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            deepx-engine-"${VERSION}"-*.tar.gz deepx-engine-"${VERSION}"-*.tar.gz.sha256 native.json
