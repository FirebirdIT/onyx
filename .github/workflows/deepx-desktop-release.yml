name: Deep X Desktop Release
# Builds the Deep X desktop installers and the Tauri updater files, then
# publishes a GitHub release with `latest.json` (Tauri v2 static updater
# format). The hub serves that file at /api/desktop/latest.json.
concurrency:
  group: Deep-X-Desktop-Release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.2.3 (makes the tag desktop-v<version>)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#desktop-v}"
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '${VERSION}' is not semver (major.minor.patch)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Drafts have no tag yet, so list releases instead of a tag lookup.
          release_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n1)
          if [ -z "${release_id}" ]; then
            release_id=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${TAG}" \
              -f target_commitish="${GITHUB_SHA}" \
              -f name="Deep X desktop ${VERSION}" \
              -f body="Deep X desktop app ${VERSION}. Download the installer for your computer below." \
              -F draft=true \
              -f make_latest=false \
              --jq '.id')
          fi
          echo "id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: windows-latest
            args: "--bundles nsis,msi"
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          # tauri-action needs the credentials to upload release assets.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # ratchet:oven-sh/setup-bun@v2 # zizmor: ignore[cache-poisoning]
        with:
          bun-version: "1.3.13"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6d9817901c499d6b02debbb57edb38d33daa680b # zizmor: ignore[impostor-commit]
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Set version and turn on updater artifacts
        shell: bash
        working-directory: ./desktop
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          # WiX (MSI) accepts only numeric versions, so drop a pre-release suffix on Windows.
          if [ "${RUNNER_OS_NAME}" = "Windows" ]; then
            VERSION="${VERSION%%-*}"
          fi
          sed "s/^version = .*/version = \"${VERSION}\"/" src-tauri/Cargo.toml > src-tauri/Cargo.toml.tmp
          mv src-tauri/Cargo.toml.tmp src-tauri/Cargo.toml
          jq --arg v "${VERSION}" '.version = $v | .bundle.createUpdaterArtifacts = true' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          jq --arg v "${VERSION}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      # Apple signing is optional: without the secrets the app is not signed.
      - name: Import Apple certificate
        if: runner.os == 'macOS'
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE}" ]; then
            echo "No Apple certificate secret. The macOS build is not signed."
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${APPLE_CERTIFICATE}" | base64 --decode > certificate.p12
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" build.keychain
          rm certificate.p12
          identity=$(security find-identity -v -p codesigning build.keychain \
            | grep -E "(Developer ID Application|Apple Distribution|Apple Development)" \
            | head -n 1 | awk -F'"' '{print $2}')
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # ratchet:tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.prepare.outputs.release-id }}
          # The publish job writes latest.json once, after all builds, so two
          # builds never race to update it.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Write latest.json and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/releases"
          gh api --paginate "${api}/${RELEASE_ID}/assets" > assets.json

          asset_name() { jq -r --arg s "$1" '[.[] | select(.name | endswith($s))][0].name // empty' assets.json; }
          asset_sig() {
            local id
            id=$(jq -r --arg n "$1.sig" '[.[] | select(.name == $n)][0].id // empty' assets.json)
            [ -n "${id}" ] || { echo "::error::Missing signature for $1"; exit 1; }
            gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
          }
          asset_url() {
            local encoded
            encoded=$(jq -rn --arg n "$1" '$n | @uri')
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${encoded}"
          }

          mac=$(asset_name ".app.tar.gz")
          win=$(asset_name "-setup.exe")
          [ -n "${mac}" ] || { echo "::error::No macOS updater bundle (.app.tar.gz)"; exit 1; }
          [ -n "${win}" ] || { echo "::error::No Windows NSIS installer (-setup.exe)"; exit 1; }
          mac_sig=$(asset_sig "${mac}")
          win_sig=$(asset_sig "${win}")
          mac_url=$(asset_url "${mac}")
          win_url=$(asset_url "${win}")

          jq -n \
            --arg version "${VERSION}" \
            --arg notes "Deep X desktop ${VERSION}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_sig "${mac_sig}" --arg mac_url "${mac_url}" \
            --arg win_sig "${win_sig}" --arg win_url "${win_url}" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {
              "darwin-aarch64": {signature: $mac_sig, url: $mac_url},
              "darwin-x86_64": {signature: $mac_sig, url: $mac_url},
              "windows-x86_64": {signature: $win_sig, url: $win_url}
            }}' > latest.json
          cat latest.json

          existing=$(jq -r '[.[] | select(.name == "latest.json")][0].id // empty' assets.json)
          if [ -n "${existing}" ]; then
            gh api --method DELETE "${api}/assets/${existing}"
          fi
          upload_url="https://uploads.github.com/${api}/${RELEASE_ID}/assets?name=latest.json"
          gh api --method POST -H "Content-Type: application/json" "${upload_url}" --input latest.json > /dev/null

          gh api --method PATCH "${api}/${RELEASE_ID}" -F draft=false -f make_latest=false > /dev/null
          echo "Published ${TAG}"
