<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deep X Backup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <div class="card-top">
        <svg class="logo" viewBox="0 0 32 32" fill="none" aria-label="Deep X">
          <path
            d="M5 5h5l12 22h5M5 27h5L22 5h5"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <h1 id="title">Back up Deep X</h1>
      <p class="lead" id="intro"></p>
      <form class="content" id="form">
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          />
        </div>
        <div class="field">
          <label for="passphrase">Passphrase</label>
          <input
            type="password"
            id="passphrase"
            placeholder="12 characters or more"
            autocomplete="new-password"
            required
          />
        </div>
        <div class="field" id="confirmField">
          <label for="confirm">Confirm Passphrase</label>
          <input
            type="password"
            id="confirm"
            placeholder="Type the passphrase again"
            autocomplete="new-password"
          />
        </div>
        <div class="message" id="message"></div>
        <div class="log" id="log" style="display: none"></div>
        <div class="buttons stack">
          <button class="primary block" id="submitBtn" type="submit">
            Back up now
          </button>
          <button class="ghost block" id="closeBtn" type="button">Close</button>
        </div>
      </form>
    </main>
    <script src="backup.js"></script>
  </body>
</html>
