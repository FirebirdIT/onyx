[package]
name = "deepx"
version = "0.0.0-dev"
description = "Deep X desktop app: runs the local Deep X engine and opens it"
authors = ["Deep X"]
edition = "2021"
license = "MIT"
repository = "https://github.com/FirebirdIT/onyx"
readme = "../README.md"
keywords = ["desktop", "tauri", "deepx"]
categories = ["gui"]
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-window-state = "2.4.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
directories = "5.0"
tokio = { version = "1", features = ["time", "process", "io-util", "sync", "macros", "rt", "net"] }
window-vibrancy = "0.7.1"
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
subtle = "2.6"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
